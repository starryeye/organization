apply plugin: 'java-test-fixtures'

dependencies {
    api project(':core')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // 조직도(OrgChart)를 SCIM 요청 시퀀스로 옮기는 렌더러가 여기 산다.
    testFixturesApi testFixtures(project(':core'))
    // 요청 시퀀스를 파일로 떨구는 생성기가 Jackson 을 쓴다 — DTO 의 직렬화 규칙을
    // 그대로 태워야 실제로 앱이 받는 본문과 같은 것이 나온다.
    testFixturesImplementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation testFixtures(project(':core'))
}

// 실제 앱에 직접 쏴 볼 최초 싱크 요청 시퀀스를 만든다.
// SCIM 은 우리가 받는 쪽이라, 실측하려면 IdP 역할로 밖에서 쏠 수단이 필요하다.
tasks.register('generateScimSeed', JavaExec) {
    group = 'verification'
    description = 'SCIM 최초 싱크 요청 시퀀스를 docker/scim 아래에 만든다'
    classpath = sourceSets.testFixtures.runtimeClasspath
    mainClass = 'dev.starryeye.organization.scim.fixture.ScimSeedWriter'
    args = [rootProject.file('docker/scim').absolutePath]
}
