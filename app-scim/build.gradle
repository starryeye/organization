apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':core')
    implementation project(':storage-dynamodb')
    implementation project(':authz-openfga')
    implementation project(':connector-scim')
    implementation project(':admin-api')
    // 리소스 서버 — 경로별 범위, 표면에 맞춘 401·403, 행위자 웹 필터(설계 2026-10-28 §4). 시험 도우미(testFixtures)는 아래 testImplementation 에만 둔다
    implementation project(':web-security')

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation libs.micrometer.tracing.otel
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation libs.aws.dynamodb

    // 규모 E2E 는 조직도 픽스처와 검증 하네스를 커넥터별 렌더러와 함께 쓴다
    testImplementation testFixtures(project(':core'))
    // OpenFGA 를 우리 어댑터를 거치지 않고 직접 두드리는 교차 검증용
    testImplementation testFixtures(project(':authz-openfga'))
    testImplementation testFixtures(project(':connector-scim'))
    testImplementation testFixtures(project(':admin-api'))
    // 리소스 서버(web-security)의 시험 도우미 — 시험 토큰(TestTokens)과 모든 범위의 기본 머리. 시험 키가 들어 있으므로 main 클래스패스에는 절대 올리지 않는다
    testImplementation testFixtures(project(':web-security'))
    // 컨트롤러 슬라이스 시험이 보안 필터체인 없이 인증 주체를 직접 넣을 때 쓴다(mockAuthentication)
    testImplementation 'org.springframework.security:spring-security-test'
    // 진짜 인가 서버로 하는 시험(RealAuthServerEndToEndTest, 설계 2026-10-28 §8.2)이 같은 JVM 에서 app-auth 를 띄운다. 서블릿(Spring MVC)과 Tomcat 이 함께
    // 올라온다 — 이 앱은 application.yml 의 web-application-type: reactive 로 리액티브로 뜨고, 부트가 Netty 보다 먼저 고르는 Tomcat 대신 Netty 에 뜨게
    // 시험 자동 구성(NettyServerTestAutoConfiguration)이 잡는다. app-auth 의 패키지(dev.starryeye.authserver)는 이 앱의 스캔 밖이다
    testImplementation project(':app-auth')
    testImplementation libs.testcontainers.junit
    testImplementation libs.openfga.sdk
}
