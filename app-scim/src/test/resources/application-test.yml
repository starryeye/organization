# 테스트 서버는 127.0.0.1 에만 연다. macOS 는 같은 포트 번호를 "127.0.0.1 전용" 리스너와 "모든 주소" 리스너가 함께 쓸 수 있고,
# 그때 localhost(= 127.0.0.1) 로 가는 연결은 전용 쪽이 받는다. 모든 주소로 열면 IntelliJ 처럼 127.0.0.1 에 포트를 연 프로그램과
# 번호가 겹쳐 테스트 요청이 그 프로그램으로 샌다(본문 없는 404). 127.0.0.1 로 열면 운영체제가 이미 쓰이는 번호를 주지 않는다.
server:
  address: 127.0.0.1

# 시험의 인증(web-security 의 testFixtures, 설계 2026-10-28 §8.1). 시험 디코더가 TestTokens 의 공개 키로 검증하고, 실행 중인 서버에 묶인 WebTestClient 가
# 모든 범위를 가진 test-client 토큰을 기본 머리로 싣는다 — 그래서 기존 시험은 그대로 지나간다. 토큰 없는 요청이나 범위가 모자란 요청은 시험에서 따로 만든다.
# 기동 검사(ResourceServerSettings)는 시험 디코더를 쓸 때도 두 주소를 요구한다 — 이 키 목록 주소에는 묻지 않는다
test:
  auth:
    fixed-key: true

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.test
          jwk-set-uri: https://auth.test/oauth2/jwks

sync:
  archive-cron: "-"
  purge-cron: "-"

dynamodb:
  region: ap-northeast-2
  table-name: organization-scim-e2e
  create-table-on-startup: true

openfga:
  store-name: organization-scim-e2e
  # 시험 OpenFGA(Containers.openFga())는 사전 공유 키를 요구한다 — Containers.OPENFGA_KEY 와 같은 값. 앱 시험은 api-url 만 등록하고 키는 여기서 받는다
  api-token: test-openfga-key

management:
  endpoint:
    health:
      # 운영 값은 when-authorized(roles SCOPE_actuator)다. 시험은 어느 토큰으로 부르든(토큰이 없어도) 컴포넌트별 상태를 보도록 여기서만
      # 되돌린다. 운영 값의 동작은 ScimAuthEndToEndTest 가 그 값으로 띄워 본다.
      show-details: always
