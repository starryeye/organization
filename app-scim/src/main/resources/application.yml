server:
  port: 8082

spring:
  application:
    name: organization-scim
  reactor:
    # trace 컨텍스트는 Reactor Context 를 타고 항상 흐르지만, Logback 이 읽는 것은
    # ThreadLocal(MDC)이다. 그 둘을 잇는 다리를 언제 건널지가 이 값이다.
    # 기본값 limited 는 handle/tap/doOnEach 에서만 건너므로, 우리 체인에서는
    # traceId 가 한 줄도 안 찍힌다(실측 확인).
    #
    # 주의: auto 는 Hooks.enableAutomaticContextPropagation() 을 부른다 —
    # JVM 전역 스위치이고 이 프로세스의 모든 Reactor 연산자에 걸린다.
    # 우리 코드뿐 아니라 Spring·AWS SDK 의 리액티브 경로까지 포함된다.
    # I/O 대기가 지배적인 워크로드라 비용을 감수할 만하다고 보고 켠다.
    context-propagation: auto

openfga:
  api-url: http://localhost:8080
  store-name: organization-scim
  # 기동 때 store 가 없으면 만든다. 로컬만 true — 운영(application-prod.yml)은 false 라 이름 오타가 빈 store 를 새로 만들지 않고 기동을 멈춘다.
  # 켜든 끄든 인가 모델은 최신과 내용이 다를 때만 쓴다
  create-store: true
  write-batch-size: 100
  max-retries: 3
  request-concurrency: 4

dynamodb:
  endpoint: http://localhost:8000
  region: ap-northeast-2
  table-name: organization-scim
  # 기동 때 테이블이 없으면 만든다. 로컬만 true — 운영(application-prod.yml)은 false 라 이름 오타가 빈 테이블을 새로 만들지 않고 기동을 멈춘다.
  # 켜든 끄든 기동 때 테이블의 모양(GSI·TTL)은 늘 확인한다
  create-table-on-startup: true
  # true 면 만들 때 삭제 보호와 PITR 을 켜고, 이미 있는 테이블은 둘이 켜져 있는지 확인한다. 로컬 DynamoDB 는 PITR 을 받지 않으므로 false
  require-protection: false
  snapshot-retention-days: 7
  syncrun-retention-days: 30
  # 변경 이력 보관 일수. 늘리려면 syncrun-retention-days 와 함께 늘린다 — 이력의 원인 회차가 먼저 사라지면 거슬러 갈 곳이 없다
  audit-retention-days: 30

sync:
  archive-cron: "0 0 3 * * *"
  purge-cron: "0 0 4 * * *"
  # 재적재 한 번의 전체 기한. 넘으면 남은 일을 멈추고 FAILED("기한 초과 — 30분")로 기록한 뒤 락을 푼다
  job-timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 8082 는 SCIM 엔드포인트와 같은 포트이고 인증이 없다. always 로 두면
      # openfga.api-url, dynamodb.table-name, Health.down(error) 의 예외 메시지가
      # 그대로 공개된다.
      show-details: when-authorized
      # liveness·readiness 그룹은 부트 기본 구성 그대로 둔다 — 외부 의존(OpenFGA·DynamoDB)을 넣지 않는다. 그 장애가 재시작을 부르면
      # 안 되기 때문이다. 외부 의존은 /actuator/health 본 그룹에서 본다.
      probes:
        enabled: true

  tracing:
    sampling:
      # 내보내는 곳이 없으므로 샘플링을 줄일 이유가 없다. 100% 여야
      # 모든 로그 줄에 traceId 가 붙는다.
      probability: 1.0

logging:
  level:
    dev.starryeye.organization: DEBUG
