# 프로덕션에서만 로그를 JSON 으로 낸다. 로컬은 평문이라 사람이 읽기 쉽고,
# 프로덕션은 수집기가 필드를 그대로 파싱한다.
#
# ecs = Elastic Common Schema. Spring Boot 3.4 부터 내장이라 별도 인코더 의존성
# (logstash-logback-encoder)도 logback-spring.xml 도 필요 없다.
# 수집 백엔드가 정해지면 gelf/logstash 로 바꾸거나 커스텀 포맷을 지정하면 된다.
#
# traceId/spanId 는 이 포맷에서 자동으로 최상위 필드가 된다 —
# 평문 로그의 [traceId-spanId] 자리와 같은 값이다.
logging:
  structured:
    format:
      console: ecs
  level:
    dev.starryeye.organization: INFO

# 운영 DynamoDB 테이블은 앱이 만들지 않는다(설계 2026-10-27 §3). 처음 설치라면 create-table-on-startup=true 로 한 번 띄우거나 미리 만든다.
# require-protection 은 삭제 보호와 PITR 을 요구한다 — 하나라도 꺼져 있으면 기동을 멈춘다
dynamodb:
  create-table-on-startup: false
  require-protection: true

# 운영 OpenFGA store 도 앱이 만들지 않는다(설계 2026-10-27 §4). 처음 설치라면 create-store=true 로 한 번 띄운다.
# 없으면 기동을 멈춘다 — 이름 오타가 빈 store 를 새로 만들어 쓰기가 엉뚱한 곳으로 가지 않는다
#
# 사전 공유 키는 환경에서 받는다 — 기본값을 두지 않는다(설계 2026-10-28 §7). 환경 변수가 없으면 부트는 자리표시자를 풀지 못하고 "${OPENFGA_API_TOKEN}" 문자열을
# 그대로 넣으므로 OpenFgaSettingsCheck 가 기동 때 그 값을 알아보고 멈춘다(값은 오류 문구에 싣지 않는다). 키가 틀리면 기동 때 OpenFGA 가 401 로 답해 멈춘다.
# require-tls 는 openfga.api-url 이 https:// 가 아니면 기동을 멈춘다 — 키가 평문으로 다니지 않는다
openfga:
  create-store: false
  api-token: ${OPENFGA_API_TOKEN}
  require-api-token: true
  require-tls: true

# 리소스 서버(설계 2026-10-28 A2·A12). 인가 서버의 발급자와 키 목록 주소를 환경에서 받는다 — 기본값을 두지 않는다. 환경 변수가 없으면 부트가 자리표시자를 풀지 못해
# (PlaceholderResolutionException: AUTH_JWK_SET_URI) 기동이 멈추고, 빈 값으로 주면 ResourceServerSettings 가 기동 때 알아보고 멈춘다.
# issuer-uri 는 인가 서버(app-auth 의 AUTH_ISSUER 또는 회사 IdP)의 발급자와 같아야 한다 — 토큰의 iss 와 맞지 않으면 모든 토큰이 401 이다.
# require-https 는 둘이 https:// 가 아니면 기동을 멈춘다 — 평문 jwk-set-uri 는 중간자가 자기 키를 내밀어 아무 토큰이나 위조하게 한다
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI}
          jwk-set-uri: ${AUTH_JWK_SET_URI}

auth:
  require-https: true
