server:
  port: 8081

spring:
  application:
    name: organization-ldap
  reactor:
    # trace 컨텍스트는 Reactor Context 를 타고 항상 흐르지만, Logback 이 읽는 것은
    # ThreadLocal(MDC)이다. 그 둘을 잇는 다리를 언제 건널지가 이 값이다.
    # 기본값 limited 는 handle/tap/doOnEach 에서만 건너므로, 우리 체인에서는
    # traceId 가 한 줄도 안 찍힌다(실측 확인).
    #
    # 주의: auto 는 Hooks.enableAutomaticContextPropagation() 을 부른다 —
    # JVM 전역 스위치이고 이 프로세스의 모든 Reactor 연산자에 걸린다.
    # 우리 코드뿐 아니라 Spring·AWS SDK 의 리액티브 경로까지 포함된다.
    # I/O 대기가 지배적인 워크로드라 비용을 감수할 만하다고 보고 켠다.
    context-propagation: auto

sync:
  cron: "0 0 3 * * *"
  purge-cron: "0 0 4 * * *"
  # 동기화·재적재 한 번의 전체 기한. 넘으면 남은 일을 멈추고 FAILED("기한 초과 — 30분")로 기록한 뒤 작업 락을 푼다
  job-timeout: 30m
  deletion-guard:
    enabled: true
    threshold-ratio: 0.3
    min-baseline: 10

ldap:
  url: ldap://localhost:1389
  base-dn: dc=example,dc=com
  bind-dn: cn=admin,dc=example,dc=com
  bind-password: adminpassword
  page-size: 500
  connect-timeout: 10s
  read-timeout: 150s
  strategy: group-of-names
  # id 는 서버가 엔트리마다 만들어 이름이 바뀌어도 유지하는 불변 값이다(entryUUID — OpenLDAP·389DS 등). AD 는 objectGUID,
  # 로그인 속성은 sAMAccountName 을 권한다. uid/cn/ou 같은 이름 기반 id 도 쓸 수 있지만 개명이 삭제+생성이 된다
  group-of-names:
    user-search-base: ou=people
    # 필터 전체(RFC 4515)를 그대로 서버에 보낸다. AD 는 "(&(objectCategory=person)(objectClass=user))" — user 가 computer 의 상위 클래스라 컴퓨터 계정을 빼려면 필요하다
    user-filter: "(objectClass=inetOrgPerson)"
    user-id-attribute: entryUUID
    user-login-attribute: uid
    user-name-attribute: displayName
    user-mail-attribute: mail
    group-search-base: ou=groups
    # AD 는 "(objectClass=group)"
    group-filter: "(objectClass=groupOfNames)"
    group-id-attribute: entryUUID
    group-name-attribute: description
    member-attribute: member
  dit:
    root-dn: ou=company
    # AD 의 기본 컨테이너(CN=Users — OU 가 아니다)도 조직으로 읽으려면 "(|(objectClass=organizationalUnit)(&(objectClass=container)(cn=Users)))".
    # 맨 "(objectClass=container)" 를 더하면 root-dn 이 도메인 루트일 때 CN=System·GPO 같은 시스템 컨테이너까지 조직이 된다
    org-unit-filter: "(objectClass=organizationalUnit)"
    group-id-attribute: entryUUID
    group-name-attribute: description
    # AD 는 "(&(objectCategory=person)(objectClass=user))"
    user-filter: "(objectClass=inetOrgPerson)"
    user-id-attribute: entryUUID
    user-login-attribute: uid
    user-name-attribute: displayName
    user-mail-attribute: mail

openfga:
  api-url: http://localhost:8080
  store-name: organization
  write-batch-size: 100
  max-retries: 3
  request-concurrency: 4

dynamodb:
  endpoint: http://localhost:8000
  region: ap-northeast-2
  table-name: organization
  create-table-on-startup: true
  snapshot-retention-days: 7
  syncrun-retention-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      # 내보내는 곳이 없으므로 샘플링을 줄일 이유가 없다. 100% 여야
      # 모든 로그 줄에 traceId 가 붙는다.
      probability: 1.0

logging:
  level:
    dev.starryeye.organization: DEBUG
