server:
  port: 8081

spring:
  application:
    name: organization-ldap
  reactor:
    # trace 컨텍스트는 Reactor Context 를 타고 항상 흐르지만, Logback 이 읽는 것은
    # ThreadLocal(MDC)이다. 그 둘을 잇는 다리를 언제 건널지가 이 값이다.
    # 기본값 limited 는 handle/tap/doOnEach 에서만 건너므로, 우리 체인에서는
    # traceId 가 한 줄도 안 찍힌다(실측 확인).
    #
    # 주의: auto 는 Hooks.enableAutomaticContextPropagation() 을 부른다 —
    # JVM 전역 스위치이고 이 프로세스의 모든 Reactor 연산자에 걸린다.
    # 우리 코드뿐 아니라 Spring·AWS SDK 의 리액티브 경로까지 포함된다.
    # I/O 대기가 지배적인 워크로드라 비용을 감수할 만하다고 보고 켠다.
    context-propagation: auto

sync:
  cron: "0 0 3 * * *"
  purge-cron: "0 0 4 * * *"
  deletion-guard:
    enabled: true
    threshold-ratio: 0.3
    min-baseline: 10

ldap:
  url: ldap://localhost:1389
  base-dn: dc=example,dc=com
  bind-dn: cn=admin,dc=example,dc=com
  bind-password: adminpassword
  page-size: 500
  strategy: group-of-names
  group-of-names:
    user-search-base: ou=people
    user-object-class: inetOrgPerson
    user-id-attribute: uid
    user-name-attribute: displayName
    user-mail-attribute: mail
    group-search-base: ou=groups
    group-object-class: groupOfNames
    group-id-attribute: cn
    group-name-attribute: description
    member-attribute: member
  dit:
    root-dn: ou=company
    org-unit-object-class: organizationalUnit
    group-id-attribute: ou
    group-name-attribute: description
    user-object-class: inetOrgPerson
    user-id-attribute: uid
    user-name-attribute: displayName
    user-mail-attribute: mail

openfga:
  api-url: http://localhost:8080
  store-name: organization
  write-batch-size: 100
  max-retries: 3

dynamodb:
  endpoint: http://localhost:8000
  region: ap-northeast-2
  table-name: organization
  create-table-on-startup: true
  snapshot-retention-days: 7
  syncrun-retention-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      # 내보내는 곳이 없으므로 샘플링을 줄일 이유가 없다. 100% 여야
      # 모든 로그 줄에 traceId 가 붙는다.
      probability: 1.0

logging:
  level:
    dev.starryeye.organization: DEBUG
