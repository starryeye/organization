# 테스트 서버는 127.0.0.1 에만 연다. macOS 는 같은 포트 번호를 "127.0.0.1 전용" 리스너와 "모든 주소" 리스너가 함께 쓸 수 있고,
# 그때 localhost(= 127.0.0.1) 로 가는 연결은 전용 쪽이 받는다. 모든 주소로 열면 IntelliJ 처럼 127.0.0.1 에 포트를 연 프로그램과
# 번호가 겹쳐 테스트 요청이 그 프로그램으로 샌다(본문 없는 404). 127.0.0.1 로 열면 운영체제가 이미 쓰이는 번호를 주지 않는다.
server:
  address: 127.0.0.1

sync:
  cron: "-"
  purge-cron: "-"
  deletion-guard:
    enabled: true
    threshold-ratio: 0.3
    min-baseline: 10

ldap:
  base-dn: dc=example,dc=com
  bind-dn: cn=admin,dc=example,dc=com
  bind-password: adminpassword
  strategy: group-of-names
  group-of-names:
    user-search-base: ou=people
    user-object-class: inetOrgPerson
    user-id-attribute: uid
    user-name-attribute: displayName
    user-mail-attribute: mail
    group-search-base: ou=groups
    group-object-class: groupOfNames
    group-id-attribute: cn
    group-name-attribute: description
    member-attribute: member

dynamodb:
  region: ap-northeast-2
  table-name: organization-e2e
  create-table-on-startup: true

openfga:
  store-name: organization-e2e
