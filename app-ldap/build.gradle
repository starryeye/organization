apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':core')
    implementation project(':storage-dynamodb')
    implementation project(':authz-openfga')
    implementation project(':connector-ldap')
    implementation project(':admin-api')

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation libs.micrometer.tracing.otel
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation libs.aws.dynamodb

    // 규모 E2E 는 조직도 픽스처와 검증 하네스를 커넥터별 렌더러와 함께 쓴다
    testImplementation testFixtures(project(':core'))
    testImplementation testFixtures(project(':connector-ldap'))
    testImplementation libs.testcontainers.junit
    testImplementation libs.unboundid.ldapsdk
    testImplementation libs.openfga.sdk
}
