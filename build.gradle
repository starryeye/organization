plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'dev.starryeye'
    version = '0.0.1-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}"
            mavenBom libs.aws.bom.get().toString()
            mavenBom libs.testcontainers.bom.get().toString()
        }
    }

    dependencies {
        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation libs.reactor.test
        // Gradle 이 번들한 junit-platform-launcher 는 Boot BOM 이 관리하는
        // junit-platform-engine 보다 낡아서 테스트 탐색 자체가 실패한다.
        // BOM 이 버전을 맞추도록 명시적으로 올려둔다.
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // 실행 모듈(app-*)에는 java-library 를 적용하지 않는다. 이 플러그인이 주는 것은
    // 'api' 구성 — 이 모듈을 의존하는 쪽에 무엇을 노출할지 가르는 장치인데,
    // 부트 애플리케이션은 아무도 의존하지 않으므로 노출할 API 자체가 없다.
    if (!name.startsWith('app-')) {
        apply plugin: 'java-library'
    }

    plugins.withId('java-test-fixtures') {
        dependencies {
            testFixturesCompileOnly libs.lombok
            testFixturesAnnotationProcessor libs.lombok
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
        }

        // Testcontainers 가 내장한 docker-java 는 Docker 데몬 감지 시 API 버전을
        // 1.32 로 고정 요청하는데, 최신 Docker Engine(MinAPIVersion 1.40+)이 이를
        // 거부해 컨테이너 기동 자체가 막히는 문제가 있어 우회한다. 기본값 1.44 는
        // docker-java 가 지원하는 최신 버전이며, DOCKER_API_VERSION 환경변수로
        // 다른 환경에 맞게 덮어쓸 수 있다.
        systemProperty 'api.version', System.getenv('DOCKER_API_VERSION') ?: '1.44'
    }
}
